# Netlify configuration for AgriCommunity (Vite SPA)
# Deploy: connect repo to Netlify, set env vars (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# VITE_GEMINI_API_KEY) in Netlify > Site settings > Environment, build command => npm run build,
# publish directory => dist.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: mọi đường dẫn đều trỏ về index.html (không 404 khi refresh trang con)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache tĩnh dài (tài nguyên có hash của Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
