name: CI — AgriCommunity

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Dùng `npm install` thay `npm ci`: npm ci có thể hard-fail (EBADPLATFORM)
      # trên các optionalDependencies theo-nền-tảng của esbuild (Vite/Vitest).
      # `npm install` resolve optional deps đúng theo OS/CPU đang chạy.
      - name: Cài dependencies
        run: npm install --no-audit --no-fund

      - name: Kiểm thử (Vitest)
        run: npm test

      - name: Build production
        run: npm run build

      - name: Cài browser cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Kiểm thử E2E (Playwright)
        run: npm run test:e2e

      - name: Upload báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
