# Cấu hình Supabase project (dùng cho supabase CLI + deploy Edge Functions)
project_id = "gjavupiyrnuwtersagnw"

[functions.kb-crawler]
# verify_jwt: giữ FALSE vì pg_cron gọi nội bộ không có JWT người dùng.
# NHƯNG function đã tự xác thực bằng secret header `x-crawler-secret`
# (so sánh với CRAWLER_SECRET) — chặn người lạ kích hoạt crawl.
verify_jwt = false
enabled = true

[functions.gemini-proxy]
# verify_jwt = true → CHỈ user đã đăng nhập (JWT hợp lệ) mới gọi được.
# Đây là tầng bảo vệ chính: GEMINI_API_KEY nằm ở server, không lộ trong bundle client.
verify_jwt = true
enabled = true

[functions.kb-from-video]
# Chỉ admin gọi (verify_jwt=true) — bóc video YouTube → kiểm chứng chéo → raw_articles draft.
# Chống người lạ gọi tốn tài nguyên / chèn nguồn không tin cậy.
verify_jwt = true
enabled = true

[functions.kb-ingest]
# verify_jwt=false: pg_cron (nội bộ) gọi định kỳ — function TỰ xác thực bằng
# header `x-crawler-secret` (CRAWLER_SECRET) như kb-crawler. Tạo embedding ngay khi publish.
verify_jwt = false
enabled = true

[functions.kb-embed]
# Chỉ admin gọi (verify_jwt=true) — tạo embedding (pgvector) + tìm kiếm ngữ nghĩa (Tầng 3).
verify_jwt = true
enabled = true
